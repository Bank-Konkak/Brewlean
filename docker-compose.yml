version: "3.8"

services:
  brew-lean-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brew-lean-website
    restart: always
    ports:
      - "8082:3000"
    environment:
      - NODE_ENV=production
    # หากมีการใช้ Database สามารถเพิ่มได้ที่นี่
    networks:
      - brew-lean-network

networks:
  brew-lean-network:
    driver: bridge
